name: Frontend CI

# No path filter: the job must always report a status, otherwise a required
# check in the ruleset would block PRs that do not touch frontend/.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      # Vitest detects CI=true (set by GitHub Actions) and runs once instead of watching.
      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
