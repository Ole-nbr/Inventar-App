name: Backend CI

# No path filter: the job must always report a status, otherwise a required
# check in the ruleset would block PRs that do not touch backend/.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Same major version as docker-compose.yml, so integration tests match local development.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: inventar
          POSTGRES_PASSWORD: inventar
          POSTGRES_DB: inventar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventar -d inventar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://inventar:inventar@127.0.0.1:5432/inventar_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app tests

      - name: Run tests
        run: uv run pytest
